# GitHub Actions workflow: automatic Vercel production deploys
#
# GitHub rejects pushes of files under .github/workflows/ unless the token has the
# `workflow` scope, so this recipe is stored as documentation. To enable automatic
# deploys on every push to main:
#
#   1. Copy this file to .github/workflows/deploy.yml
#   2. Set repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   3. Commit and push
#
# Note: when the Vercel project is linked to this GitHub repository (Git
# Integration), Vercel already deploys every push to main by itself — this
# workflow is only needed if you prefer CI-driven deploys with tests.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
